name: Enterprise CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  NODE_ENV: development
  JWT_SECRET: dev-secret-at-least-32-characters-long-manaratak-key-phrase
  SESSION_SECRET: dev-session-secret-at-least-32-chars-long
  CSRF_SECRET: dev-csrf-secret-at-least-32-chars-long
  REDIS_URL: redis://localhost:6379
  CORS_ORIGIN: http://localhost:3000
  ADMIN_AUTH_MODE: strict

jobs:
  ai-studio-compatibility:
    name: Isolated Google AI Studio Web preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 immutable snapshot
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - run: npm run verify:aistudio
      - run: npx --no-install vitest run tests/aistudio/compatibility.spec.ts
      - run: npm run build:aistudio
      - run: node scripts/aistudio/environment.mjs --check

  source-quality:
    name: Full source closure gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 immutable snapshot
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate branch naming
        if: github.event_name == 'pull_request'
        run: node scripts/git/validate-branch-name.mjs "${{ github.head_ref }}"
      - name: Validate commit messages
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            git log --format=%s "origin/${{ github.base_ref }}..HEAD" | while IFS= read -r message; do
              node scripts/git/validate-commit-message.mjs "$message"
            done
          else
            node scripts/git/validate-commit-message.mjs "$(git log -1 --format=%s)"
          fi
      - name: Source quality and cycle/accessibility gate
        run: npm run quality:source
      - name: CI runtime dependency regression contracts
        run: node --test tests/architecture/ci-runtime-regressions.test.mjs
      - name: Authoritative registered source-closure manifest
        env:
          DATABASE_MUTATIONS_ALLOWED: 'false'
          DATABASE_ENVIRONMENT: source
        run: npm run ci:closure:manifest
      - name: Prisma source schema validate and client generation
        run: npm run db:source:verify
      - name: Typecheck all referenced workspaces
        run: npm run typecheck
      - name: Verify Vercel TypeScript configuration and compilation
        run: npm run vercel:typecheck
      - name: Lint source
        run: npm run lint
      - name: Build all required applications and packages
        run: npm run build
      - name: Unit and source integration tests
        run: npm run test:unit
      - name: Build deterministic immutable release artifacts
        run: npm run release:artifacts && npm run release:verify
      - name: Upload immutable release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 immutable snapshot
        with:
          name: manaratak-release-artifacts-${{ github.sha }}
          path: release-artifacts
          if-no-files-found: error
      - name: Write P12 source CI evidence
        run: npm run ci:source:evidence
      - name: Upload P12 source CI evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 immutable snapshot
        with:
          name: p12-full-source-ci-closure
          path: p12-ci-evidence/SOURCE_CI_CLOSURE.json
          if-no-files-found: error

  translation-quality:
    name: Translation quality gates
    runs-on: ubuntu-latest
    env:
      DATABASE_MUTATIONS_ALLOWED: 'false'
      DATABASE_ENVIRONMENT: source
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 immutable snapshot
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run source-only translation quality gates
        shell: bash
        run: |
          unset DATABASE_URL
          test -z "${DATABASE_URL+x}"
          npm run translation:ci

  # P12 source closure intentionally excludes DB-backed integration and browser E2E.
  # They are classified in docs/remediation/p12/P12_RUNTIME_PENDING_CHECKS.md and
  # run only after a disposable runtime/database is supplied. No source gate is skipped
  # merely because DATABASE_URL is absent.

  configuration:
    name: Deployment configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env.compose.example config

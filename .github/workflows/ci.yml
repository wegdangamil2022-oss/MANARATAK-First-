name: Enterprise CI Pipeline

on:
  push:
    branches: [ "main", "develop", "feat/post28-r07-artifact-preparation" ]
  pull_request:
    branches: [ "main", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_ENV: development
  JWT_SECRET: dev-secret-at-least-32-characters-long-manaratak-key-phrase
  SESSION_SECRET: dev-session-secret-at-least-32-chars-long
  CSRF_SECRET: dev-csrf-secret-at-least-32-chars-long
  CORS_ORIGIN: http://localhost:3000
  ADMIN_AUTH_MODE: strict

jobs:
  r09-workflow-diagnostics:
    name: R09 isolated workflow ownership and transaction proof
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/post28-r07-artifact-preparation'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Install the browser for the new synthetic workflow profile
        run: npx playwright install --with-deps chromium
      - name: Exercise new workflows once in one restricted PostgreSQL 16 dataset
        run: node scripts/release/post28-r09-workflow-lab.mjs "$RUNNER_TEMP/r09-workflows"
      - name: Retain workflow observations and cleanup without credentials
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r09-workflow-proof-${{ github.sha }}
          path: ${{ runner.temp }}/r09-workflows/proof
          if-no-files-found: warn

  r08-runtime-diagnostics:
    name: R08 isolated Redis and Linux worker shutdown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Exercise actual Linux process signals and absolute deadline
        run: node --test tests/runtime/post28-r08-process-drain.test.mjs
      - name: Provision new restricted Redis and exercise counter and health isolation
        shell: bash
        run: |
          unset DATABASE_URL DIRECT_URL REDIS_URL
          node scripts/release/post28-r08-redis-lab.mjs
      - name: Retain scoped Redis diagnostic receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r08-redis-diagnostic-${{ github.sha }}
          path: /tmp/post28-r08-redis-result.json
          if-no-files-found: warn
      - name: Exercise only new refund recovery and timeout cases in a new PG16 lab
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/post28-r07-artifact-preparation'
        run: node scripts/release/post28-r08-provider-faults.mjs "$RUNNER_TEMP/r08-provider"
      - name: Retain new provider fault proof without lab credentials
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/feat/post28-r07-artifact-preparation'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r08-provider-faults-${{ github.sha }}
          path: ${{ runner.temp }}/r08-provider/proof
          if-no-files-found: warn

  source-quality:
    name: Full source closure gates
    runs-on: ubuntu-latest
    outputs:
      manifest-sha256: ${{ steps.artifacts.outputs.manifest-sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 immutable snapshot
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate branch naming
        if: github.event_name == 'pull_request'
        run: node scripts/git/validate-branch-name.mjs "${{ github.head_ref }}"
      - name: Validate commit messages
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            git log --format=%s "origin/${{ github.base_ref }}..HEAD" | while IFS= read -r message; do
              node scripts/git/validate-commit-message.mjs "$message"
            done
          else
            node scripts/git/validate-commit-message.mjs "$(git log -1 --format=%s)"
          fi
      - name: Source quality and cycle/accessibility gate
        id: source-quality
        run: npm run quality:source
      - name: Cross-cutting source preflight
        id: source-preflight
        run: npm run ci:preflight
      - name: CI and migration source regression contracts
        id: source-regressions
        run: node --test tests/architecture/ci-runtime-regressions.test.mjs tests/remediation/w2-migration-recovery-source.test.mjs tests/remediation/m10-recovery-gate-exit.test.mjs tests/release/post28-r07-static-runtime.test.mjs
      - name: Install local Nginx contract fixture
        run: sudo apt-get update && sudo apt-get install -y nginx
      - name: Authoritative registered source-closure manifest
        id: source-closure
        env:
          DATABASE_MUTATIONS_ALLOWED: 'false'
          DATABASE_ENVIRONMENT: source
        run: npm run ci:closure:manifest
      - name: Prisma source schema validate and client generation
        id: prisma-source
        run: npm run db:source:verify
      - name: Typecheck all referenced workspaces
        id: typecheck
        run: npm run typecheck
      - name: Verify Vercel TypeScript configuration and compilation
        id: vercel-typecheck
        run: npm run vercel:typecheck
      - name: Lint source
        id: lint
        run: npm run lint
      - name: Build all required applications and packages
        id: build
        run: npm run build
      - name: Unit and source integration tests
        id: unit
        run: node scripts/ci/run-source-unit-with-diagnostics.mjs npm run test:unit
      - name: Build deterministic immutable release artifacts
        id: artifacts
        shell: bash
        env:
          RELEASE_ARTIFACT_OUTPUT_DIR: ${{ runner.temp }}/r07-built-release
        run: |
          set -euo pipefail
          npm run release:artifacts
          npm run release:verify -- "$RELEASE_ARTIFACT_OUTPUT_DIR"
          echo "manifest-sha256=$(sha256sum "$RELEASE_ARTIFACT_OUTPUT_DIR/release-manifest.json" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Upload immutable release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 immutable snapshot
        with:
          name: manaratak-release-artifacts-${{ github.sha }}
          path: ${{ runner.temp }}/r07-built-release
          if-no-files-found: error
      - name: Write P12 source CI evidence
        if: always()
        env:
          SOURCE_CI_STEPS_JSON: >-
            {"source-quality":"${{ steps.source-quality.outcome }}","source-preflight":"${{ steps.source-preflight.outcome }}","source-regressions":"${{ steps.source-regressions.outcome }}","source-closure":"${{ steps.source-closure.outcome }}","prisma-source":"${{ steps.prisma-source.outcome }}","typecheck":"${{ steps.typecheck.outcome }}","vercel-typecheck":"${{ steps.vercel-typecheck.outcome }}","lint":"${{ steps.lint.outcome }}","build":"${{ steps.build.outcome }}","unit":"${{ steps.unit.outcome }}","artifacts":"${{ steps.artifacts.outcome }}"}
          SOURCE_EVIDENCE_SIGNING_KEY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.SOURCE_EVIDENCE_SIGNING_KEY || '' }}
          SOURCE_SECTION_REVIEW_LEDGER_JSON: ${{ vars.SOURCE_SECTION_REVIEW_LEDGER_JSON }}
        run: npm run ci:source:evidence
      - name: Upload P12 source CI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 immutable snapshot
        with:
          name: p12-full-source-ci-closure
          path: p12-ci-evidence/SOURCE_CI_CLOSURE.json
          if-no-files-found: error

  artifact-retrieval:
    name: Retrieve and verify immutable artifacts from Actions storage
    needs: source-quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.16.0
      - name: Download this run's exact-SHA artifact to a fresh directory
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" -n "manaratak-release-artifacts-$GITHUB_SHA" -D "$RUNNER_TEMP/recovered-release"
      - name: Verify independently retained manifest digest and every unit
        shell: bash
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.source-quality.outputs.manifest-sha256 }}
        run: |
          set -euo pipefail
          test "${#EXPECTED_MANIFEST_SHA256}" -eq 64
          printf '%s  %s\n' "$EXPECTED_MANIFEST_SHA256" "$RUNNER_TEMP/recovered-release/release-manifest.json" | sha256sum --check
          node scripts/release/verify-release-artifacts.mjs "$RUNNER_TEMP/recovered-release" | tee artifact-retrieval.txt
          sha256sum "$RUNNER_TEMP/recovered-release/"* >> artifact-retrieval.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: artifact-retrieval-${{ github.sha }}
          path: artifact-retrieval.txt
          if-no-files-found: error

  linux-runtime-review:
    name: Linux x64 review image and native runtime
    needs: [source-quality, artifact-retrieval]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Retrieve exact reviewed units outside the checkout
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.source-quality.outputs.manifest-sha256 }}
        run: |
          mkdir "$RUNNER_TEMP/r07-linux"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" -n "manaratak-release-artifacts-$GITHUB_SHA" -D "$RUNNER_TEMP/r07-linux/artifacts"
          printf '%s  %s\n' "$EXPECTED_MANIFEST_SHA256" "$RUNNER_TEMP/r07-linux/artifacts/release-manifest.json" | sha256sum --check
          node scripts/release/verify-release-artifacts.mjs "$RUNNER_TEMP/r07-linux/artifacts"
          mkdir "$RUNNER_TEMP/r07-linux/unpacked-api"
          tar -xf "$RUNNER_TEMP/r07-linux/artifacts/manaratak-api-$GITHUB_SHA.tar" -C "$RUNNER_TEMP/r07-linux/unpacked-api"
      - name: Install and verify a fresh locked Linux runtime layer
        run: node scripts/release/post28-prepare-runtime-layer.mjs "$RUNNER_TEMP/r07-linux"
      - name: Build digest-pinned non-root image and load native modules without network
        run: node scripts/release/post28-linux-image-probe.mjs "$RUNNER_TEMP/r07-linux"
      - name: Install browser for the isolated Linux review
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/post28-r07-artifact-preparation'
        run: npx --no-install playwright install --with-deps chromium
      - name: Exercise R09 public owner pagination and unpublished course denial
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/post28-r07-artifact-preparation'
        env:
          POST28_LINUX_RUNTIME_REVIEW: 'YES'
        run: node scripts/release/post28-linux-artifact-runtime.mjs "$RUNNER_TEMP/r07-linux" --r09-public
      - name: Verify rich text sanitization in Chromium without external requests
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/post28-r07-artifact-preparation'
        run: node scripts/security/verify-cms-rich-text-browser.mjs "$RUNNER_TEMP/r07-linux/cms-rich-text-proof.json"
      - name: Retain review proof without publishing the image
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-runtime-review-${{ github.sha }}
          path: |
            ${{ runner.temp }}/r07-linux/linux-image-probe.json
            ${{ runner.temp }}/r07-linux/runtime-layer.json
            ${{ runner.temp }}/r07-linux/runtime-install.log
            ${{ runner.temp }}/r07-linux/cms-rich-text-proof.json
            ${{ runner.temp }}/r07-linux/linux-runtime-proof
          if-no-files-found: error

  translation-quality:
    name: Translation quality gates
    runs-on: ubuntu-latest
    env:
      DATABASE_MUTATIONS_ALLOWED: 'false'
      DATABASE_ENVIRONMENT: source
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 immutable snapshot
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run source-only translation quality gates
        shell: bash
        run: |
          unset DATABASE_URL
          test -z "${DATABASE_URL+x}"
          npm run translation:ci

  # P12 source closure intentionally excludes DB-backed integration and browser E2E.
  # They are classified in docs/remediation/p12/P12_RUNTIME_PENDING_CHECKS.md and
  # run only after a disposable runtime/database is supplied. No source gate is skipped
  # merely because DATABASE_URL is absent.

  configuration:
    name: Deployment configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env.compose.example config

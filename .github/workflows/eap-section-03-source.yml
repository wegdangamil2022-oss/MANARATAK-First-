name: EAP Section 03 Source Verification

on:
  push:
    branches:
      - codex/section-01-iam-rbac
    paths:
      - 'apps/admin/src/components/AssetPicker.tsx'
      - 'apps/admin/src/pages/AssetAdminPage.tsx'
      - 'apps/api/src/app.ts'
      - 'apps/api/src/presentation/api/router/Asset*'
      - 'apps/api/tests/presentation/api/router/Asset*'
      - 'packages/application/src/asset-platform/**'
      - 'packages/application/tests/asset-platform/**'
      - 'packages/domain/src/asset-platform/**'
      - 'packages/domain/tests/asset-platform/**'
      - 'packages/infrastructure/src/asset-platform/**'
      - 'packages/infrastructure/tests/asset-platform/**'
      - 'packages/shared/src/authorization/adminPermissionCatalog.ts'
      - 'docs/remediation/SECTION_03_EAP_IMPLEMENTATION.md'
      - 'docs/operations/ASSET_PROVIDER_RUNTIME.md'
      - 'scripts/verify-w3-source.mjs'
      - 'tests/remediation/w3-asset-provider.test.mjs'
      - '.github/workflows/eap-section-03-source.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eap-section-03-source-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  DATABASE_MUTATIONS_ALLOWED: 'false'
  DATABASE_ENVIRONMENT: source

jobs:
  typecheck:
    name: Repository TypeScript source validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        # v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - name: TypeScript project references
        run: npm run typecheck
      - name: Repository source quality
        run: npm run quality:source

  eap-tests:
    name: EAP targeted source regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - name: Build all workspace project references needed by Vitest
        run: npm run typecheck
      - name: Asset domain, application, infrastructure and API contracts
        run: >-
          npx --no-install vitest run --config vitest.config.ts
          packages/domain/tests/asset-platform
          packages/application/tests/asset-platform
          packages/infrastructure/tests/asset-platform
          apps/api/tests/presentation/api/router/AssetReuseRouter.spec.ts
          apps/api/tests/presentation/api/router/AssetUsageImpact.spec.ts
          apps/api/tests/presentation/api/router/AssetPlatformErrorContract.spec.ts
          apps/api/tests/presentation/api/router/AssetFinalizationContract.spec.ts
      - name: Legacy provider transport security checks
        run: node --test tests/remediation/w3-asset-provider.test.mjs

  eap-postgres:
    name: EAP disposable PostgreSQL concurrency and purge reconciliation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eap_ci
          POSTGRES_PASSWORD: eap_ci_disposable_only
          POSTGRES_DB: manaratak_eap_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eap_ci -d manaratak_eap_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # These are *constant localhost disposable* test credentials, not a linked or production database.
      DATABASE_URL: postgresql://eap_ci:eap_ci_disposable_only@127.0.0.1:5432/manaratak_eap_ci_test?schema=public
      DIRECT_URL: postgresql://eap_ci:eap_ci_disposable_only@127.0.0.1:5432/manaratak_eap_ci_test?schema=public
      DATABASE_MUTATIONS_ALLOWED: 'true'
      RUN_DATABASE_INTEGRATION_TESTS: 'true'
      EAP_EPHEMERAL_DB_TESTS: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - name: Build TypeScript project references
        run: npm run typecheck
      - name: Create schema on disposable localhost PostgreSQL only
        run: npx --no-install prisma db push --schema=packages/infrastructure/prisma/schema.prisma --skip-generate
      - name: Run EAP PostgreSQL real-CAS and purge-recovery tests
        run: >-
          npx --no-install vitest run --config vitest.config.ts
          packages/infrastructure/tests/asset-platform/PrismaAssetPostgres.database.spec.ts

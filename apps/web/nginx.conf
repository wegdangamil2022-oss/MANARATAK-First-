server {
    listen 80;
    server_name localhost;

    # Canonical CMS slugs: return real HTTP redirects before SPA fallback.
    # Only CMS-owned public route shapes are intercepted; unrelated B2C paths
    # remain owned by their original frontends.
    location ~ ^/(ar|en)/(articles|news|study-guides|checklists|faqs|pages|landing)/[a-z0-9-]+$ {
        proxy_pass http://api:3000/api/v1/public/cms/redirects/http-resolve?path=$uri;
        proxy_intercept_errors on;
        error_page 404 = @cms_spa_fallback;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location @cms_spa_fallback {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # Serve static frontend web assets
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend API service container
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

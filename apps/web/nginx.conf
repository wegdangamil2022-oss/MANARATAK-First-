server {
    listen 80;
    server_name localhost;

    # CMS detail HTML and redirects come from the current published owner.
    # Only CMS-owned public route shapes are intercepted; unrelated B2C paths
    # remain owned by their original frontends.
    location ~ ^/(ar|en)/(articles|news|study-guides|checklists|faqs|pages|landing)/[a-z0-9-]+$ {
        set $cms_canonical_path $uri;
        # No URI in regex-location proxy_pass, and no dynamic DNS dependency.
        # The trailing ? discards caller query arguments before owner lookup.
        rewrite ^ /api/v1/public/cms/pages/http-resolve?path=$cms_canonical_path? break;
        proxy_pass http://api:3000;
        proxy_cache off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # The CMS-only sitemap is live and publication-aware. It is deliberately
    # not served from static prerender assets, which may be stale after archive.
    location = /cms-sitemap.xml {
        proxy_pass http://api:3000/api/v1/public/cms/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /cms-app-entry.js {
        root /usr/share/nginx/html;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Serve static frontend web assets
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend API service container
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

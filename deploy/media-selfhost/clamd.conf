Foreground yes
TCPSocket 3310
TCPAddr 0.0.0.0
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
LogTime yes
LogFile /dev/stdout
MaxThreads 2
MaxConnectionQueueLength 8
MaxScanSize 128M
MaxFileSize 64M
StreamMaxLength 64M
AlertExceedsMax yes
MaxRecursion 12
MaxFiles 10000
ReadTimeout 30
CommandReadTimeout 10
SelfCheck 60
ConcurrentDatabaseReload no
ExitOnOOM yes
